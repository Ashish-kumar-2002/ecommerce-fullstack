spring.application.name=sb.ecom
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.app.jwtSecret=${SPRING_APP_JWTSECRET}
spring.app.jwtExpirationMs=${SPRING_APP_JWTEXPIRATIONMS}
spring.ecom.app.jwtCookieName=${SPRING_ECOM_APP_JWTCOOKIENAME}



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG


frontend.url=${FRONTEND_URL:http://localhost:5173/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}
project.image=${PROJECT_IMAGE_PATH:D:/SpringBootProject/Udemy project/sb.ecom/images}



# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}







