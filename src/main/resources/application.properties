spring.application.name=sb.ecom
server.port=8080

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# FRONTEND
# ===============================
frontend.url=${FRONTEND_URL:http://localhost:5173/}

# ===============================
# IMAGE
# ===============================
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}
project.image=${PROJECT_IMAGE_PATH:D:/SpringBootProject/Udemy project/sb.ecom/images}

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# JWT
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME:springBootEcom}

# ===============================
# STRIPE
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}

# ===============================
# OPENAI
# ===============================
openai.api.key=${OPENAI_API_KEY}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG